name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Nothing is writable by default; every job re-declares the (read-only) permissions it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: RSpec (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3.13", "3.4.12", "4.0.9"]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: Check the Ruby version
      env:
        EXPECTED_RUBY: ${{ matrix.ruby }}
      run: script/check_ruby.sh "$EXPECTED_RUBY"
    # SimpleCov enforces minimum_coverage 100 (line + branch) and fails the run below it.
    - name: RSpec with the 100% line + branch coverage gate
      run: bundle exec rspec

  # Verify every supported ActiveRecord minor, not only the newest resolvable one.
  test-activerecord:
    name: RSpec (ActiveRecord ${{ matrix.activerecord }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        activerecord: ["~> 7.1.0", "~> 7.2.0", "~> 8.0.0", "~> 8.1.0"]
    env:
      AR_VERSION: ${{ matrix.activerecord }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
      with:
        ruby-version: .ruby-version
        bundler-cache: true
    - name: Check the Ruby version
      run: script/check_ruby.sh
    - run: bundle exec rspec

  # Run the suite against a real PostgreSQL server so row locking (FOR UPDATE)
  # in the atomic methods is actually exercised (it is a no-op on SQLite).
  test-postgres:
    name: RSpec (PostgreSQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
      with:
        ruby-version: .ruby-version
        bundler-cache: true
    - name: Check the Ruby version
      run: script/check_ruby.sh
    - run: bundle exec rspec

  test-mysql:
    name: RSpec (MySQL ${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: lts
          image: mysql:lts@sha256:86b390ef642f89a0157d6215dee33ddc928b8b0ecab173117f56f6c40cb24eab
        - name: latest
          image: mysql:latest@sha256:7b16ec7caa94ca7e92f4c5ec287de69d2e8738db056ceb629022951a6f6d910b
    services:
      mysql:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bitwise_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: mysql2://root:root@127.0.0.1:3306/bitwise_test
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
      with:
        ruby-version: .ruby-version
        bundler-cache: true
    - name: Check the Ruby version
      run: script/check_ruby.sh
    - run: bundle exec rspec

  lint:
    name: RuboCop
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
      with:
        ruby-version: .ruby-version
        bundler-cache: true
    - name: Check the Ruby version
      run: script/check_ruby.sh
    - run: bundle exec rake rubocop

  typecheck:
    name: Sorbet
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
      with:
        ruby-version: .ruby-version
        bundler-cache: true
    - name: Check the Ruby version
      run: script/check_ruby.sh
    - run: bundle exec rake typecheck

  docs:
    name: YARD (100% documented)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
      with:
        ruby-version: .ruby-version
        bundler-cache: true
    - name: Check the Ruby version
      run: script/check_ruby.sh
    - run: bundle exec rake yard

  smells:
    name: Reek and Flay
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
      with:
        ruby-version: .ruby-version
        bundler-cache: true
    - name: Check the Ruby version
      run: script/check_ruby.sh
    - run: bundle exec rake reek flay

  # Behavior is unchanged: the spec files that were on `main` before the refactoring pass must
  # still pass against the current lib/ (see script/legacy_suite.rb for the few justified exceptions).
  legacy-suite:
    name: Original spec suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
      with:
        ruby-version: .ruby-version
        bundler-cache: true
    - name: Check the Ruby version
      run: script/check_ruby.sh
    - run: bundle exec rake legacy_suite

  # Every gem must be at its newest release, except those on the documented hold list
  # (script/outdated_holds.yml), which quotes the upstream constraint that blocks each one.
  outdated:
    name: Outdated gems
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
      with:
        ruby-version: .ruby-version
        bundler-cache: true
    - name: Check the Ruby version
      run: script/check_ruby.sh
    - run: bundle exec rake outdated

  build:
    name: Build gem
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
      with:
        ruby-version: .ruby-version
        bundler-cache: true
    - name: Check the Ruby version
      run: script/check_ruby.sh
    - run: gem build activerecord-bitwise.gemspec
