# Reek is run in CI with no warnings tolerated. Every relaxation below is a deliberate,
# documented decision; new smells must be fixed in code rather than added here.
detectors:
  # Sorbet's T.unsafe / T.any / T::Array and Thread.current are annotation and platform
  # idioms, not duplicated domain logic.
  DuplicateMethodCall:
    max_calls: 2
    allow_calls:
      - 'T.unsafe'
      - 'T.any'
      - 'T.must'
      - 'T::Array'
      - 'Thread.current'
  # NULL is a first-class database value for a bitmask column ("no value" vs "no flags"),
  # so explicit nil handling on attribute values is domain logic, not a missing null object.
  NilCheck:
    enabled: false
  # The gem integrates with arbitrary ActiveRecord classes and Arel nodes by duck typing
  # (respond_to?(:bitwise_definitions), respond_to?(:id)); that is the integration contract.
  ManualDispatch:
    enabled: false
  # Stateless helpers are modules of functions by design; private helper methods of
  # instances may stay small and self-contained.
  UtilityFunction:
    public_methods_only: true
  # The query/definer helpers deliberately operate on a collaborator passed in as an
  # argument (a relation, a model class, an RBI node) rather than on their own state.
  FeatureEnvy:
    enabled: false
  # Same limit as RuboCop's Metrics/ParameterLists default.
  LongParameterList:
    max_params: 5
  # Pairs of related parameters (e.g. column name and mapping) are not a clump worth a class.
  DataClump:
    min_clump_size: 3
  # Slightly above Reek's default of 5; method length is still capped at 10 lines by RuboCop.
  TooManyStatements:
    max_statements: 8
  # Type is an immutable value object holding its configuration and derived constants.
  TooManyInstanceVariables:
    max_instance_variables: 6
  # `rescue ... => e` is the universal Ruby convention (and RuboCop's Naming/RescuedExceptionsVariableName).
  UncommunicativeVariableName:
    accept:
      - e
  RepeatedConditional:
    max_ifs: 3

exclude_paths:
  # Stand-in for Tapioca's compiler base class: empty bodies and unused parameters by design.
  - lib/tapioca/dsl/compiler_stub.rb
