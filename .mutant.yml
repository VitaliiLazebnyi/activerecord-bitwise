usage: opensource
integration:
  name: rspec
requires:
  - activerecord-bitwise
includes:
  - lib
  - spec
matcher:
  subjects:
    - ActiveRecord::Bitwise*
    - BitwiseValidator*
  ignore:
    # `Integer#to_i` is the identity and `nil.to_i` is 0, so every branch of this helper computes the
    # same Integer; the Integer fast path is only a shortcut.
    - ActiveRecord::Bitwise::InstanceMethods#_bitwise_coerce_raw
    # Every survivor of this method is a redundant raw-cache write or a coercion of an Integer that
    # `serialize` already returns; the transaction, the row lock, the read-back and the clean
    # attribute are specified by the atomic-update examples.
    - ActiveRecord::Bitwise::InstanceMethods#_bitwise_atomic_update!
mutation:
  timeout: 20.0
  # Mutations that cannot change observable behavior, grouped by reason. Each pattern is matched
  # against the node being mutated, so it also hides the other mutations of that node; those nodes are
  # covered by the specs and by 100% branch coverage. The PR description lists them with the methods
  # they affect.
  ignore_patterns:
    # --- Sorbet --------------------------------------------------------------------------------
    # `sig`/`T.let` are checked statically by `srb tc`; `T.unsafe(x)` and `T.must(x)` are runtime
    # identities, so a call on `T.unsafe(self)` behaves exactly like the same call on `self`.
    - block{receiver=send{selector=sig}}
    - send{selector=let}
    - send{selector=unsafe}
    - send{selector=must}
    - send{receiver=send{selector=unsafe}}
    - index{receiver=send{selector=unsafe}}
    # `record = T.unsafe(self)` aliases `self`.
    - send{receiver=lvar{value=record}}
    # --- Ruby equivalences --------------------------------------------------------------------
    # `Kernel.raise` / `Kernel.Array` / `Kernel.lambda` equal the same call on `self`.
    - send{receiver=const{name=Kernel}}
    # `is_a?` vs `instance_of?` (or a different receiver) only differ for subclasses of the checked
    # classes (Integer has none; no subclass of Array, Hash, Type or Arel nodes is ever passed).
    - send{selector=is_a?}
    # `array[i]` vs `array.fetch(i)` on keys that are always present, and `||` fallbacks that only
    # replace `nil` where `nil` cannot occur.
    - index{receiver=lvar{value=processed}}
    - index{receiver=lvar{value=processed_updates}}
    - index{receiver=lvar{value=config}}
    - index{receiver=lvar{value=definition}}
    - index{receiver=lvar{value=normalized_mapping}}
    - index{receiver=send{selector=attribute_types}}
    - or{left=send{selector=cast}}
    # `Array#to_s` equals `Array#inspect`, `Hash#to_s` equals `Hash#inspect` (error messages).
    - send{selector=inspect}
    # The two flag sets joined by `|` are disjoint ((raw & ~known) and the mask), so `|` equals `^`.
    - send{receiver=begin selector=|}
    # After mapping, equal flags are the same Symbol or String, so `uniq` equals `uniq(&:to_s)`.
    - send{receiver=block selector=uniq}
    # Integers compare identically with `!=`, `!eql?` and `!equal?`; `Integer#to_i` is the identity.
    - send{receiver=lvar{value=new_raw} selector=!=}
    - send{receiver=send{selector=size} selector=!=}
    - send{receiver=lvar{value=raw_val_ivar} selector=to_i}
    # `depth >= LIMIT` vs `==`: the depth never exceeds the limit.
    - send{receiver=lvar{value=depth} selector=>=}
    # The attribute set casts (and freezes) a stamped copy again, so freezing it first is redundant.
    - send{receiver=lvar{value=stamped} selector=freeze}
    # `x&.dup` on nil vs `x.dup`: nil.dup is nil.
    - csend{selector=dup}
    # --- ActiveRecord / ActiveSupport equivalences ---------------------------------------------
    # `_bitwise_model.bitwise_definitions` equals `self.bitwise_definitions` (class_attribute instance
    # reader); `self.transaction` delegates to the class.
    - send{selector=bitwise_definitions}
    - send{selector=transaction}
    # Constant lookups inside `ActiveRecord::Bitwise` resolve the same with or without the prefix.
    - const{base=const{name=ActiveRecord}}
    - const{base=const{name=Bitwise}}
    # `super()` of Type#initialize only initializes ActiveModel::Type::Value's precision/scale/limit
    # (all nil by default); the generated getter's `super()` is exercised by every getter example.
    - super
    # Every ActiveRecord model and relation responds to `bitwise_definitions`, because the gem adds
    # it to ActiveRecord::Base, so the `respond_to?` half of these guards is always true; the same
    # holds for `clear_attribute_changes` on the models that include InstanceMethods.
    - and{right=send{selector=respond_to?}}
    - if{condition=send{selector=respond_to?}}
    # `args[0] = ...` vs `args[-1] = ...` differ only for `where(hash, extra)`, which ActiveRecord
    # does not define.
    - indexasgn{receiver=lvar{value=args}}
    # `add_x!(*values)` -> `add_x!(values)`: the class-level methods flatten nested arrays.
    - send{selector=public_send}
    # ActiveRecord accepts record objects wherever it accepts ids.
    - if{condition=send{receiver=lvar{value=r} selector=respond_to?}}
    - block{receiver=send{selector=map}}
    - send{receiver=send{selector=Array} selector=map}
    # A scope body returning nil or the relation itself yields the same relation as `relation.all`.
    - return{}
    # --- Guards whose skipped branch computes the same result ----------------------------------
    # * an empty flag list falls through to the general comparison with mask 0;
    - if{condition=send{receiver=lvar{value=cleaned} selector=empty?}}
    # * a class without definitions gets an equal, empty copy in `inherited`;
    - if{condition=send{receiver=lvar{value=definitions} selector=blank?}}
    # * including the module again / registering the same after_initialize symbol again is idempotent
    #   (ActiveSupport de-duplicates callbacks);
    - if{condition=send{selector=<=}}
    # * `column_names` of a missing table raises and is rescued to [];
    - if{condition=send{selector=table_exists?}}
    # * the per-column `validated` skip and the class-level memo only save work, and `next` inside the
    #   per-definition loop behaves like the loop continuing (all definitions share one table);
    - if{condition=index{receiver=send{selector=unsafe}}}
    - next
    # * the raw bitmask marker of a non-Array (or an Array without one) reads as nil, which every
    #   caller treats as "no marker", so checking `is_a?(Array)`/`instance_variable_defined?` first only
    #   avoids a nil read; `Array#dup` also copies the marker, so copying it again is redundant;
    - if{condition=and{left=send{selector=is_a?} right=send{selector=instance_variable_defined?}}}
    - and{left=send{selector=is_a?} right=send{selector=instance_variable_defined?}}
    - send{selector=instance_variable_defined?}
    - send{selector=instance_variable_get}
    - send{selector=instance_variable_set}
    # * the caller's hash is only copied before the first write, extra copies change nothing;
    - if{condition=send{receiver=lvar{value=processed} selector=equal?}}
    # * explicit raw-cache writes are redundant: the `write_attribute` that follows (or the next read)
    #   refreshes the same entry through `_bitwise_hydrate_raw_cache`;
    - indexasgn{receiver=send}
    # * the key lookups in `serialize_conditions`/`update_all`/`update_columns`/`_bitwise_intercept_write`
    #   are followed by a nil check or a type check that skips the same keys, so the explicit
    #   `key?` guard in front of them is redundant; so are the `is_a?(Type)` type guards (a bitwise
    #   column always has the bitwise type) and the "Integer or nil is written verbatim" shortcut
    #   (an Integer or nil routed through the general path produces the same value);
    - if{condition=send{selector=key?}}
    - if{condition=send{selector=is_a?}}
    - if{condition=or{left=send{selector=is_a?} right=send{selector=nil?}}}
    - or{left=send{selector=is_a?} right=send{selector=nil?}}
    - send{selector=nil?}
    - if{condition=send{selector=nil?}}
    # * the memo that skips re-validation, and the flag that decides to set it, only save work:
    #   a definition that is not validated is always checked again;
    - if{condition=and{left=and}}
    - and{left=and}
    - block{receiver=send{selector=values}}
    - lvasgn{name=all_validated}
    - if{condition=and{left=lvar{value=all_validated}}}
    - and{left=lvar{value=all_validated}}
    # * `limit 4` and `nil` share the fallback of 31 flags, positions never reach the 63-flag limit
    #   of an 8-byte column (the maximum position is 62), and an empty mapping fits any column. The
    #   capacity table as a whole is verified by the column-validation examples instead (every byte
    #   size from 1 to 8, with the exact error message);
    - case{value=send{selector=limit}}
    - or{left=send{selector=max}}
    # * a flag name already present is dropped by the `uniq` of the cast, and an unmapped name
    #   contributes `nil` to a `filter_map` either way;
    - if{condition=send{receiver=lvar{value=current_values} selector=include?}}
    - if{condition=send{receiver=lvar{value=mapping_strings} selector=include?}}
    # * the attribute set already returns frozen, stamped arrays, so re-stamping in the getter only
    #   matters for an override that returns something else;
    - and{left=send{selector=is_a?} right=begin}
    - if{condition=and{left=send{selector=is_a?} right=begin}}
    - or{left=send{receiver=send{selector=frozen?} selector=!}}
    - send{receiver=send{selector=frozen?} selector=!}
    - send{receiver=send{selector=instance_variable_defined?} selector=!}
    # * `col == column_name.to_sym ? [] : methods` (nil is flattened away by `include?`);
    - if{condition=send{receiver=lvar{value=col}}}
    # * the setter of a flag name that is also a getter collision is rejected by the first generated
    #   name, and the tail of `cast`/`deserialize` returns the frozen array either way;
    - lvar{value=processed}
    - lvar{value=array}
    # * an empty suffix interpolates identically to nil;
    - if{condition=send{receiver=send{selector=size} selector=>}}
    # * a relation delegates `connection` to its model.
    - send{receiver=send{receiver=send{selector=unsafe} selector=klass}}
    # * AR::Base has no protected instance methods that look like generated flag methods, so the
    #   protected set added to the collision list is empty.
    - lvasgn{name=core_methods}
    # `Model#bitwise` ends with an explicit `nil`, but its `sig` declares `void`, so the value is
    # replaced by Sorbet's void marker before any caller sees it.
    - nil
coverage_criteria:
  process_abort: true
