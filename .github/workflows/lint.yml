---
# Pull requests are cancelled when a newer commit arrives; runs on main always finish.
concurrency:
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"
  group: "${{ github.workflow }}-${{ github.ref }}"

jobs:
  # Every file type of the repository that RuboCop does not check, each with its linter at its strictest
  # setting. The linters are installed from tools/requirements.txt, pinned with hashes; script/check runs the
  # same commands.
  lint:
    name: "Workflows, shell, YAML, TOML, Markdown, links, spelling and EditorConfig"
    permissions:
      contents: "read"
    runs-on: "ubuntu-26.04"
    steps:
      - name: "Harden the runner (egress allow-list)"
        uses: "step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a"  # v2.22.4
        with:
          # The hosts of the links of the Markdown files are listed too: lychee checks every one of them.
          allowed-endpoints: >-
            *.blob.core.windows.net:443
            api.github.com:443
            api.rubyonrails.org:443
            files.pythonhosted.org:443
            github.com:443
            keepachangelog.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            semver.org:443
            sorbet.org:443
            www.contributor-covenant.org:443
          disable-sudo-and-containers: "true"
          egress-policy: "block"
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          persist-credentials: false
      - uses: "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0"  # v7.1.0
        with:
          python-version: "3.13"
      - name: "Install the linters (tools/requirements.txt, hash-pinned)"
        run: |
          python -m venv "${RUNNER_TEMP}/lint"
          pip="${RUNNER_TEMP}/lint/bin/pip"
          "${pip}" install --quiet --disable-pip-version-check --require-hashes --requirement tools/requirements.txt
          echo "${RUNNER_TEMP}/lint/bin" >> "${GITHUB_PATH}"
      # The pinned lychee release binary, verified against its published SHA-256 first.
      - env:
          LYCHEE_SHA256: "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a"
          LYCHEE_VERSION: "0.24.2"
        name: "Install lychee 0.24.2"
        run: |
          archive="lychee-x86_64-unknown-linux-gnu.tar.gz"
          url="https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/${archive}"
          curl --fail --silent --show-error --location --output "${RUNNER_TEMP}/${archive}" "${url}"
          echo "${LYCHEE_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          member="lychee-x86_64-unknown-linux-gnu/lychee"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" --strip-components 1 "${member}"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      # actionlint also runs ShellCheck, with every optional check at style severity, on every `run:` block of the
      # workflows.
      - env:
          SHELLCHECK_OPTS: "--enable=all --severity=style"
        if: "${{ !cancelled() }}"
        name: "actionlint (GitHub workflows)"
        run: "actionlint -color"
      - env:
          GH_TOKEN: "${{ github.token }}"  # online audits (known-vulnerable actions, impostor commits)
        if: "${{ !cancelled() }}"
        name: "zizmor (GitHub workflows, auditor persona: every audit)"
        run: "zizmor --persona auditor --format plain ."
      - if: "${{ !cancelled() }}"
        name: "ShellCheck (every optional check, style severity)"
        run: "shfmt --find . | xargs shellcheck --enable=all --severity=style"
      - if: "${{ !cancelled() }}"
        name: "shfmt (format of the shell scripts, .editorconfig)"
        run: "shfmt --diff ."
      - if: "${{ !cancelled() }}"
        name: "yamllint (every rule, strict)"
        run: "yamllint --strict ."
      - if: "${{ !cancelled() }}"
        name: "taplo (TOML, .taplo.toml: lint and format)"
        run: "taplo lint && taplo format --check"
      - if: "${{ !cancelled() }}"
        name: "rumdl (every markdownlint rule, .rumdl.toml)"
        run: "rumdl check --deny-config-warnings ."
      - env:
          GITHUB_TOKEN: "${{ github.token }}"  # GitHub links are checked through the API, without its rate limit
        if: "${{ !cancelled() }}"
        name: "lychee (every link and anchor of the Markdown files, lychee.toml)"
        run: "lychee --root-dir \"${PWD}\" '**/*.md'"
      - if: "${{ !cancelled() }}"
        name: "typos (spelling)"
        run: "typos"
      - if: "${{ !cancelled() }}"
        name: "editorconfig-checker"
        run: "ec"
    timeout-minutes: 10

  warning-gate:
    if: "${{ !cancelled() }}"
    name: "Warning gate (Lint)"
    needs:
      - "lint"
    permissions:
      actions: "read"  # reads the logs of the other jobs of this run
      contents: "read"
    runs-on: "ubuntu-26.04"
    steps:
      - name: "Harden the runner (egress allow-list)"
        uses: "step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a"  # v2.22.4
        with:
          allowed-endpoints: >-
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
            results-receiver.actions.githubusercontent.com:443
          disable-sudo-and-containers: "true"
          egress-policy: "block"
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          persist-credentials: false
      - env:
          GATE_JOB_NAME: "Warning gate (Lint)"
          GH_TOKEN: "${{ github.token }}"
        name: "Fail on any warning or deprecation in the logs of this run"
        run: "script/warning_gate.sh"
    timeout-minutes: 10

name: "Lint"

"on":
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"
  workflow_dispatch: {}

# Nothing is writable by default; every job declares the (read-only) permissions it needs.
permissions: {}
...
