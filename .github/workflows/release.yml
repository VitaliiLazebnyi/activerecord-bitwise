---
# Never cancel a release in flight.
concurrency:
  cancel-in-progress: false
  group: "${{ github.workflow }}-${{ github.ref }}"

env:
  # The release installs exactly the committed Gemfile.lock.
  BUNDLE_FROZEN: "true"
  RUBYOPT: "-w -W:deprecated -W:performance"

jobs:
  build_and_release:
    # The publishing job runs in the `release` environment, whose protection rules gate every publish.
    environment: "release"
    name: "Build and release"
    needs:
      - "warning-gate-verify"
    permissions:
      contents: "write"  # create the GitHub release and attach the gem
      id-token: "write"  # RubyGems trusted publishing (OIDC)
    runs-on: "ubuntu-26.04"
    steps:
      # Audit, not block: the release only runs for a version tag, so an allow-list could not be exercised before
      # the publish it would have to let through. The egress of every release is recorded (StepSecurity insights).
      - name: "Harden the runner (egress audit)"
        uses: "step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a"  # v2.22.4
        with:
          disable-sudo-and-containers: "true"
          egress-policy: "audit"
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # No dependency cache in the release pipeline: a poisoned cache must never reach a published gem.
      # RubyGems itself, which installs the gems here, logs a performance warning under -W:performance ("The class
      # Gem::Specification reached 8 shape variations"); the installation keeps only the deprecation warnings.
      - env:
          RUBYOPT: "-W:deprecated"
        uses: "ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199"  # v1.338.0
        with:
          bundler-cache: false
          ruby-version: ".ruby-version"
      - name: "Check the Ruby version"
        run: "script/check_ruby.sh"
      # Like the setup-ruby step: RubyGems' installer keeps only the deprecation warnings.
      - env:
          RUBYOPT: "-W:deprecated"
        name: "Install the locked gems"
        run: "bundle install --jobs 4 --retry 3"
      - name: "Validate the tag against version.rb"
        run: "script/release_version.sh"
      - env:
          GEM_PRIVATE_KEY: "${{ secrets.GEM_PRIVATE_KEY }}"
        name: "Recover the private key"
        run: "script/release_signing_key.sh"
      - name: "Build the gem (warnings are fatal)"
        run: "gem build activerecord-bitwise.gemspec --strict"
      - name: "Verify the built gem is signed (fails without a certificate chain)"
        run: "gem spec \"activerecord-bitwise-${VERSION}.gem\" cert_chain | grep -q 'BEGIN CERTIFICATE'"
      - env:
          GH_TOKEN: "${{ github.token }}"
        name: "Create the GitHub release"
        run: |
          gem_file="activerecord-bitwise-${VERSION}.gem"
          gh release create "${GITHUB_REF_NAME}" "${gem_file}" --title "${GITHUB_REF_NAME}" --generate-notes
      # Pinned to the v2.1.0 release SHA (credential-handling step; never track a mutable ref here).
      - uses: "rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a"  # v2.1.0
      - name: "Publish to RubyGems"
        run: "gem push \"activerecord-bitwise-${VERSION}.gem\""
    timeout-minutes: 20

  # Gate the release on the full verification suite so that a broken tagged commit can never ship.
  verify:
    env:
      # Tapioca is in the optional :typecheck group of the Gemfile.
      BUNDLE_WITH: "typecheck"
    name: "Verify"
    permissions:
      contents: "read"
    runs-on: "ubuntu-26.04"
    steps:
      # Audit, not block: see the build_and_release job.
      - name: "Harden the runner (egress audit)"
        uses: "step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a"  # v2.22.4
        with:
          disable-sudo-and-containers: "true"
          egress-policy: "audit"
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # No dependency cache in the release pipeline: a poisoned cache must never reach a published gem.
      # RubyGems itself, which installs the gems here, logs a performance warning under -W:performance ("The class
      # Gem::Specification reached 8 shape variations"); the installation keeps only the deprecation warnings.
      - env:
          RUBYOPT: "-W:deprecated"
        uses: "ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199"  # v1.338.0
        with:
          bundler-cache: false
          ruby-version: ".ruby-version"
      - name: "Check the Ruby version"
        run: "script/check_ruby.sh"
      # Like the setup-ruby step: RubyGems' installer keeps only the deprecation warnings.
      - env:
          RUBYOPT: "-W:deprecated"
        name: "Install the locked gems"
        run: "bundle install --jobs 4 --retry 3"
      - name: "Every Ruby gate (the default Rake task), the outdated check and mutation testing"
        run: "bundle exec rake default outdated mutant"
    timeout-minutes: 120

  warning-gate:
    if: "${{ !cancelled() }}"
    name: "Warning gate (Release)"
    needs:
      - "build_and_release"
    permissions:
      actions: "read"  # reads the logs of the other jobs of this run
      contents: "read"
    runs-on: "ubuntu-26.04"
    steps:
      - name: "Harden the runner (egress allow-list)"
        uses: "step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a"  # v2.22.4
        with:
          allowed-endpoints: >-
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
            results-receiver.actions.githubusercontent.com:443
          disable-sudo-and-containers: "true"
          egress-policy: "block"
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          persist-credentials: false
      - env:
          GATE_JOB_NAME: "Warning gate (Release)"
          GH_TOKEN: "${{ github.token }}"
        name: "Fail on any warning or deprecation in the logs of this run"
        run: "script/warning_gate.sh"
    timeout-minutes: 10

  # Nothing is published when the verification logged a warning.
  warning-gate-verify:
    name: "Warning gate (Release verification)"
    needs:
      - "verify"
    permissions:
      actions: "read"  # reads the logs of the other jobs of this run
      contents: "read"
    runs-on: "ubuntu-26.04"
    steps:
      - name: "Harden the runner (egress allow-list)"
        uses: "step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a"  # v2.22.4
        with:
          allowed-endpoints: >-
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
            results-receiver.actions.githubusercontent.com:443
          disable-sudo-and-containers: "true"
          egress-policy: "block"
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          persist-credentials: false
      - env:
          GATE_JOB_NAME: "Warning gate (Release verification)"
          GH_TOKEN: "${{ github.token }}"
        name: "Fail on any warning or deprecation in the log of the verification"
        run: "script/warning_gate.sh"
    timeout-minutes: 10

name: "Automated Release"

"on":
  push:
    tags:
      - "v*.*.*"

# Nothing is writable by default; every job declares the permissions it needs.
permissions: {}
...
