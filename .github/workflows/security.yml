---
# Pull requests are cancelled when a newer commit arrives; runs on main always finish.
concurrency:
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"
  group: "${{ github.workflow }}-${{ github.ref }}"

env:
  RUBYOPT: "-w -W:deprecated -W:performance"

jobs:
  bundler-audit:
    name: "bundler-audit"
    permissions:
      contents: "read"
    runs-on: "ubuntu-26.04"
    steps:
      - name: "Harden the runner (egress allow-list)"
        uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43"  # v2.22.3
        with:
          allowed-endpoints: >-
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
            index.rubygems.org:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            rubygems.org:443
          egress-policy: "block"
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          persist-credentials: false
      # RubyGems itself, which installs the gems here, logs a performance warning under -W:performance ("The class
      # Gem::Specification reached 8 shape variations"); the installation keeps only the deprecation warnings.
      - env:
          RUBYOPT: "-W:deprecated"
        uses: "ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199"  # v1.338.0
        with:
          bundler-cache: true
          ruby-version: ".ruby-version"
      - name: "Check the Ruby version"
        run: "script/check_ruby.sh"
      - name: "No locked gem with a known vulnerability (Ruby Advisory Database)"
        run: "bundle exec rake audit"
    timeout-minutes: 10

  # Requires the repository's Dependency graph (Settings > Code security). On a push to main the review compares
  # the pushed commit with the one before it.
  dependency-review:
    if: "${{ github.event_name == 'pull_request' || github.event_name == 'push' }}"
    name: "Dependency review"
    permissions:
      contents: "read"
      pull-requests: "write"  # post the dependency review summary on the pull request
    runs-on: "ubuntu-26.04"
    steps:
      - name: "Harden the runner (egress allow-list)"
        uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43"  # v2.22.3
        with:
          allowed-endpoints: >-
            *.blob.core.windows.net:443
            api.deps.dev:443
            api.github.com:443
            api.securityscorecards.dev:443
            github.com:443
            index.rubygems.org:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            rubygems.org:443
          egress-policy: "block"
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          persist-credentials: false
      # Vulnerabilities of every severity in every scope; the configuration file explains the Scorecard settings.
      - id: "review"
        uses: "actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294"  # v5.0.0
        with:
          base-ref: "${{ github.event.pull_request.base.sha || github.event.before }}"
          config-file: "./.github/dependency-review.yml"
          head-ref: "${{ github.event.pull_request.head.sha || github.sha }}"
      # The OpenSSF Scorecard of every added dependency, with the per-package allowances of the configuration.
      # RubyGems itself, which installs the gems here, logs a performance warning under -W:performance ("The class
      # Gem::Specification reached 8 shape variations"); the installation keeps only the deprecation warnings.
      - env:
          RUBYOPT: "-W:deprecated"
        uses: "ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199"  # v1.338.0
        with:
          bundler-cache: true
          ruby-version: ".ruby-version"
      - name: "Check the Ruby version"
        run: "script/check_ruby.sh"
      - env:
          DEPENDENCY_CHANGES: "${{ steps.review.outputs.dependency-changes }}"
        name: "OpenSSF Scorecard of the added dependencies"
        run: "bundle exec ruby script/scorecard_check.rb"
    timeout-minutes: 10

  gitleaks:
    name: "Secret scanning (gitleaks)"
    permissions:
      contents: "read"
    runs-on: "ubuntu-26.04"
    steps:
      - name: "Harden the runner (egress allow-list)"
        uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43"  # v2.22.3
        with:
          allowed-endpoints: >-
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
          egress-policy: "block"
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The pinned release binary is run directly: the gitleaks action still runs on a deprecated Node.js version
      # and logs deprecation warnings. The archive is verified against its published SHA-256 first.
      - env:
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          GITLEAKS_VERSION: "8.30.1"
        name: "Install gitleaks 8.30.1"
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          curl --fail --silent --show-error --location --output "${RUNNER_TEMP}/${archive}" "${url}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" gitleaks
      - name: "Scan the full history for secrets"
        run: "\"${RUNNER_TEMP}/gitleaks\" git --redact --verbose --exit-code 1 ."
    timeout-minutes: 10

  warning-gate:
    if: "${{ !cancelled() }}"
    name: "Warning gate (Security)"
    needs:
      - "bundler-audit"
      - "dependency-review"
      - "gitleaks"
    permissions:
      actions: "read"  # reads the logs of the other jobs of this run
      contents: "read"
    runs-on: "ubuntu-26.04"
    steps:
      - name: "Harden the runner (egress allow-list)"
        uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43"  # v2.22.3
        with:
          allowed-endpoints: >-
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
            results-receiver.actions.githubusercontent.com:443
          egress-policy: "block"
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          persist-credentials: false
      - env:
          GATE_JOB_NAME: "Warning gate (Security)"
          GH_TOKEN: "${{ github.token }}"
        name: "Fail on any warning or deprecation in the logs of this run"
        run: "script/warning_gate.sh"
    timeout-minutes: 10

name: "Security"

"on":
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch: {}

# Nothing is writable by default; every job declares the permissions it needs.
permissions: {}
...
