---
# Runs on main only (Scorecard analyzes the default branch); a newer run replaces an older one.
concurrency:
  cancel-in-progress: true
  group: "${{ github.workflow }}-${{ github.ref }}"

jobs:
  # Publishing the results requires a job of `uses:` steps only, from the actions Scorecard's verification
  # allows; the SARIF file is therefore fixed up and uploaded by the next job.
  analysis:
    name: "Scorecard analysis"
    permissions:
      contents: "read"
      id-token: "write"  # publish the results to the OpenSSF Scorecard API (OIDC)
    runs-on: "ubuntu-26.04"
    steps:
      # Containers stay available: the Scorecard action is a Docker container action.
      - name: "Harden the runner (egress allow-list)"
        uses: "step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a"  # v2.22.4
        with:
          allowed-endpoints: >-
            *.blob.core.windows.net:443
            api.deps.dev:443
            api.github.com:443
            api.osv.dev:443
            api.scorecard.dev:443
            api.securityscorecards.dev:443
            fulcio.sigstore.dev:443
            github.com:443
            oss-fuzz-build-logs.storage.googleapis.com:443
            rekor.sigstore.dev:443
            results-receiver.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            www.bestpractices.dev:443
          egress-policy: "block"
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          persist-credentials: false
      - uses: "ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e"  # v2.5.0
        with:
          publish_results: true
          results_file: "results.sarif"
          results_format: "sarif"
      - uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9"  # v7.0.2
        with:
          name: "scorecard-sarif"
          path: "results.sarif"
          retention-days: 5
    timeout-minutes: 15

  upload:
    name: "Upload the Scorecard results"
    needs:
      - "analysis"
    permissions:
      actions: "read"  # download the SARIF artifact of the analysis job
      contents: "read"
      security-events: "write"  # upload the SARIF results to code scanning
    runs-on: "ubuntu-26.04"
    steps:
      - name: "Harden the runner (egress allow-list)"
        uses: "step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a"  # v2.22.4
        with:
          allowed-endpoints: >-
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
            results-receiver.actions.githubusercontent.com:443
            uploads.github.com:443
          disable-sudo-and-containers: "true"
          egress-policy: "block"
      # Downloaded with gh: actions/download-artifact (v8.0.2, the newest release) logs a Node.js deprecation
      # warning (DEP0005, its use of Buffer()).
      - env:
          GH_TOKEN: "${{ github.token }}"
        name: "Download the SARIF results of the analysis job"
        run: "gh run download \"${GITHUB_RUN_ID}\" --repo \"${GITHUB_REPOSITORY}\" --name scorecard-sarif"
      # Scorecard reports findings about the whole repository (Branch-Protection, Code-Review, Fuzzing, ...) under
      # the placeholder URI "no file associated with this alert", which upload-sarif rejects with a warning.
      # Point them at this workflow, the file that produces them.
      - name: "Give repository-level findings a valid location"
        run: |
          artifact='.runs[].results[]?.locations[]?.physicalLocation.artifactLocation'
          filter="(${artifact} | select(.uri == \$placeholder)).uri = \$workflow"
          placeholder='no file associated with this alert'
          workflow='.github/workflows/scorecard.yml'
          jq --arg placeholder "${placeholder}" --arg workflow "${workflow}" "${filter}" results.sarif > located.sarif
          mv located.sarif results.sarif
      - uses: "github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066"  # v4.39.3
        with:
          sarif_file: "results.sarif"
    timeout-minutes: 10

  warning-gate:
    if: "${{ !cancelled() }}"
    name: "Warning gate (Scorecard)"
    needs:
      - "analysis"
      - "upload"
    permissions:
      actions: "read"  # reads the logs of the other jobs of this run
      contents: "read"
    runs-on: "ubuntu-26.04"
    steps:
      - name: "Harden the runner (egress allow-list)"
        uses: "step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a"  # v2.22.4
        with:
          allowed-endpoints: >-
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
            results-receiver.actions.githubusercontent.com:443
          disable-sudo-and-containers: "true"
          egress-policy: "block"
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          persist-credentials: false
      - env:
          GATE_JOB_NAME: "Warning gate (Scorecard)"
          GH_TOKEN: "${{ github.token }}"
        name: "Fail on any warning or deprecation in the logs of this run"
        run: "script/warning_gate.sh"
    timeout-minutes: 10

name: "OpenSSF Scorecard"

"on":
  branch_protection_rule: {}
  push:
    branches:
      - "main"
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch: {}

# Nothing is writable by default; every job declares the permissions it needs.
permissions: {}
...
