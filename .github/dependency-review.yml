---
# Configuration of the Dependency review job (.github/workflows/security.yml).
# Every vulnerability fails the review, whatever its severity, in every dependency scope.
comment-summary-in-pr: "on-failure"
fail-on-scopes:
  - "development"
  - "runtime"
  - "unknown"
fail-on-severity: "low"

# Dependencies allowed below the OpenSSF Scorecard threshold. Each one names the exact version and the score it
# was accepted at (a lower score fails again), and the reason. An allowance for a gem version Gemfile.lock no
# longer has fails the check.
scorecard-allowances:
  rubygems/flog:
    reason: >-
      The per-method complexity gate (`rake flog`), a development-only tool. Ryan Davis' seattlerb projects
      publish no Scorecard practices (branch protection, CI on GitHub); flog has no runtime dependency on this
      gem and is not installed for its users.
    score: 1.5
    version: "4.9.4"
  rubygems/ruby-progressbar:
    reason: >-
      RuboCop (a development-only gate) requires it unconditionally (rubocop 1.92.2: ruby-progressbar ~> 1.7), so
      it cannot be dropped or replaced while RuboCop runs. It is not installed for users of this gem.
    score: 2.8
    version: "1.13.0"
  rubygems/tzinfo:
    reason: >-
      ActiveSupport requires it (activesupport 8.1: tzinfo ~> 2.0, >= 2.0.5), and ActiveRecord, the dependency
      this gem extends, requires ActiveSupport; no supported ActiveRecord release can run without it.
    score: 2.9
    version: "2.0.6"

# OpenSSF Scorecard: every added dependency must score at least this much. dependency-review-action can only
# change its threshold for every package at once, so its own Scorecard report is off and
# script/scorecard_check.rb applies this threshold instead (failing, not just reporting), with the
# per-package allowances above.
show-openssf-scorecard: false
warn-on-openssf-scorecard-level: 3
...
