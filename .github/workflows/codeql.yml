name: CodeQL
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '41 5 * * 1'

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
    - uses: actions/checkout@v6
    - uses: github/codeql-action/init@v4
      with:
        languages: ruby
        build-mode: none
    - uses: github/codeql-action/analyze@v4
      with:
        category: "/language:ruby"
