---
# Dependencies that are deliberately NOT at their newest release, with the reason (`blocked_by`: the exact upstream
# constraint, or `reason`). `rake outdated` (script/outdated.rb) fails for any other outdated dependency and for a
# hold that is no longer needed. Sections: gems, actions, images, rubies (by release line) and tools.
# Each gem entry quotes the exact blocking constraint (checked against rubygems.org on 2026-11-07).
gems:
  diff-lcs:
    blocked_by:
      - "rspec-expectations 3.13.6: diff-lcs >= 1.2.0, < 2.0"
      - "rspec-mocks 3.13.9: diff-lcs >= 1.2.0, < 2.0"
    newest: "2.0.0"
  prism:
    blocked_by:
      - "rubocop-ast 1.50.0: prism ~> 1.7"
      - "flay 2.14.4: prism ~> 1.7"
    newest: "2.1.0"
...
