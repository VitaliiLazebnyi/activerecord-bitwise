---
gem:
  # Reek and the dry-rb gems it depends on are development tools that no checked file refers to. Compiling their
  # RBIs touches constants that dry-rb has deprecated, which prints deprecation notices.
  exclude:
    - "dry-configurable"
    - "dry-core"
    - "dry-inflector"
    - "dry-initializer"
    - "dry-logic"
    - "dry-schema"
    - "dry-types"
    - "reek"
...
