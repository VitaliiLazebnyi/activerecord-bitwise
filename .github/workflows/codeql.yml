---
# Pull requests are cancelled when a newer commit arrives; runs on main always finish.
concurrency:
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"
  group: "${{ github.workflow }}-${{ github.ref }}"

jobs:
  analyze:
    name: "CodeQL (${{ matrix.language }}, ${{ matrix.suite }})"
    permissions:
      actions: "read"  # CodeQL reads workflow metadata
      contents: "read"
      security-events: "write"  # upload CodeQL results to code scanning
    runs-on: "ubuntu-26.04"
    steps:
      - name: "Harden the runner (egress allow-list)"
        uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43"  # v2.22.3
        with:
          allowed-endpoints: >-
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            uploads.github.com:443
          egress-policy: "block"
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          persist-credentials: false
      - uses: "github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066"  # v4.39.3
        with:
          build-mode: "none"
          languages: "${{ matrix.language }}"
          queries: "${{ matrix.suite }}"
      - uses: "github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066"  # v4.39.3
        with:
          category: "/language:${{ matrix.language }}/suite:${{ matrix.suite }}"
    strategy:
      fail-fast: false
      matrix:
        language:
          - "actions"
          - "ruby"
        suite:
          - "security-and-quality"
          - "security-extended"
    timeout-minutes: 30

  warning-gate:
    if: "${{ !cancelled() }}"
    name: "Warning gate"
    needs:
      - "analyze"
    permissions:
      actions: "read"  # reads the logs of the other jobs of this run
      contents: "read"
    runs-on: "ubuntu-26.04"
    steps:
      - name: "Harden the runner (egress allow-list)"
        uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43"  # v2.22.3
        with:
          allowed-endpoints: >-
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
            results-receiver.actions.githubusercontent.com:443
          egress-policy: "block"
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          persist-credentials: false
      - env:
          GATE_JOB_NAME: "Warning gate"
          GH_TOKEN: "${{ github.token }}"
        name: "Fail on any warning or deprecation in the logs of this run"
        run: "script/warning_gate.sh"
    timeout-minutes: 10

name: "CodeQL"

"on":
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch: {}

# Nothing is writable by default; every job declares the permissions it needs.
permissions: {}
...
