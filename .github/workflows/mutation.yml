---
# Pull requests are cancelled when a newer commit arrives; runs on main always finish.
concurrency:
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"
  group: "${{ github.workflow }}-${{ github.ref }}"

env:
  LANG: "C.UTF-8"
  LC_ALL: "C.UTF-8"
  RUBYOPT: "-w -W:deprecated -W:performance"

jobs:
  mutant:
    name: "Mutant"
    permissions:
      contents: "read"
    runs-on: "ubuntu-26.04"
    steps:
      - name: "Harden the runner (egress allow-list)"
        uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43"  # v2.22.3
        with:
          allowed-endpoints: >-
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
            index.rubygems.org:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            rubygems.org:443
          egress-policy: "block"
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          persist-credentials: false
      # Mutant parses the code with the `parser` gem (it requires `parser/current`), whose newest release
      # (3.3.13.0) has no grammar for Ruby 3.4 or 4.0 and warns on any Ruby other than 3.3.13. Mutation testing
      # therefore runs on Ruby 3.3.13, the oldest supported Ruby, which every other job also tests.
      - uses: "ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199"  # v1.338.0
        with:
          bundler-cache: true
          ruby-version: "3.3.13"
      - name: "Check the Ruby version"
        run: "script/check_ruby.sh 3.3.13"
      # Every subject, on pull requests too: any alive mutation fails the build.
      - name: "Mutant (every subject)"
        run: "bundle exec rake mutant"
    timeout-minutes: 120

  warning-gate:
    if: "${{ !cancelled() }}"
    name: "Warning gate (Mutation testing)"
    needs:
      - "mutant"
    permissions:
      actions: "read"  # reads the logs of the other jobs of this run
      contents: "read"
    runs-on: "ubuntu-26.04"
    steps:
      - name: "Harden the runner (egress allow-list)"
        uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43"  # v2.22.3
        with:
          allowed-endpoints: >-
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
            results-receiver.actions.githubusercontent.com:443
          egress-policy: "block"
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          persist-credentials: false
      - env:
          GATE_JOB_NAME: "Warning gate (Mutation testing)"
          GH_TOKEN: "${{ github.token }}"
        name: "Fail on any warning or deprecation in the logs of this run"
        run: "script/warning_gate.sh"
    timeout-minutes: 10

name: "Mutation testing"

"on":
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"
  workflow_dispatch: {}

# Nothing is writable by default; every job declares the (read-only) permissions it needs.
permissions: {}
...
